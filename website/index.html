<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pact · Plan a purchase</title>
  <style>
:root {
  --purple: #42145f;
  --purple-light: #f3edf7;
  --green: #1a7f4b;
  --text: #1d1d1f;
  --muted: #6b6b76;
  --radius: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 16px;
  background: #e9e4ee;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
}

.phone {
  width: 100%;
  max-width: 390px;
  background: #fff;
  border-radius: 36px;
  padding: 28px 20px;
  box-shadow: 0 20px 60px rgba(66, 20, 95, 0.18);
}

header h1 { margin: 0; color: var(--purple); font-size: 32px; }
.tagline { margin: 2px 0 20px; color: var(--muted); }

h2 { font-size: 18px; margin: 0 0 6px; }
.list-title { margin: 24px 0 10px; }
.hint { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }

.card {
  background: var(--purple-light);
  border-radius: var(--radius);
  padding: 18px;
}

form { display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }

input[type="text"],
input[type="number"] {
  padding: 12px;
  border: 1px solid #d6cde0;
  border-radius: 10px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  background: var(--purple);
  color: #fff;
}
button.secondary { background: transparent; color: var(--purple); border: 1px solid var(--purple); }
button.go { background: var(--green); }

ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }

.plan {
  border: 1px solid #eee;
  border-radius: var(--radius);
  padding: 14px;
}
.plan-top { display: flex; justify-content: space-between; font-weight: 600; }
.plan-status { font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
.plan.ready { border-color: var(--green); }
.plan.ready .plan-status { color: var(--green); font-weight: 600; }
.plan.done { opacity: 0.55; }

.bar { height: 8px; background: #eee; border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; background: var(--purple); transition: width 0.3s linear; }
.plan.ready .bar > div { background: var(--green); }

.actions { display: flex; gap: 8px; margin-top: 12px; }
.actions button { flex: 1; padding: 10px; font-size: 14px; }

.kept { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; }
.kept strong { font-size: 22px; color: var(--green); }

footer { margin-top: 20px; }
.demo { flex-direction: row; align-items: center; font-weight: 400; color: var(--muted); }
  </style>
</head>
<body>
  <main class="phone">
    <header>
      <h1>Pact</h1>
      <p class="tagline">A promise from you, to you.</p>
    </header>

    <section class="card">
      <h2>Plan a big purchase</h2>
      <p class="hint">Tell Pact in advance. After a short cooling-off period, it goes through without a hold.</p>

      <form id="plan-form">
        <label>
          What do you want to buy?
          <input id="item" type="text" placeholder="e.g. TV" required maxlength="40" />
        </label>
        <label>
          Roughly how much? (£)
          <input id="price" type="number" min="1" step="1" placeholder="450" required />
        </label>
        <p id="cooldown-preview" class="hint"></p>
        <button type="submit">Start cooling-off</button>
      </form>
    </section>

    <section>
      <h2 class="list-title">Your planned purchases</h2>
      <ul id="plans"></ul>
      <p id="empty" class="hint">Nothing planned yet.</p>
    </section>

    <section class="card kept">
      <span>Kept by changing your mind</span>
      <strong id="kept">£0</strong>
    </section>

    <footer>
      <label class="demo">
        <input id="demo-mode" type="checkbox" checked />
        Demo speed (1 hour = 1 second)
      </label>
    </footer>
  </main>

  <script>
// Pact — planned purchases with a cooling-off period.
// Everything is stored in the browser (localStorage); no backend yet.

const STORAGE_KEY = "pact.plans";
const KEPT_KEY = "pact.kept";
const HOUR_MS = 60 * 60 * 1000;
const READY_WINDOW_DAYS = 7;

// Bigger purchase → longer cooling-off (see PROJECT.md, section 2.3).
function cooldownHours(price) {
  if (price >= 500) return 72;
  if (price >= 100) return 48;
  return 24;
}

// In demo mode, 1 hour of cooling-off passes in 1 second.
function hourLength() {
  return document.getElementById("demo-mode").checked ? 1000 : HOUR_MS;
}

// Some viewers block localStorage; fall back to in-memory state so the page still works.
function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

let plans = load(STORAGE_KEY, []);
let kept = load(KEPT_KEY, 0);

const money = (n) => "£" + Number(n).toLocaleString("en-GB");

function formatRemaining(ms, hourMs) {
  const hours = Math.ceil(ms / hourMs);
  if (hours >= 24) {
    const days = Math.floor(hours / 24);
    const rest = hours % 24;
    return rest ? `${days}d ${rest}h left` : `${days}d left`;
  }
  return `${hours}h left`;
}

function statusOf(plan, now) {
  if (plan.status !== "cooling") return plan.status;
  if (now >= plan.expiresAt) return "expired";
  if (now >= plan.readyAt) return "ready";
  return "cooling";
}

function render() {
  const now = Date.now();
  const list = document.getElementById("plans");
  list.replaceChildren();
  document.getElementById("empty").hidden = plans.length > 0;
  document.getElementById("kept").textContent = money(kept);

  for (const plan of plans) {
    const status = statusOf(plan, now);
    const total = plan.readyAt - plan.createdAt;
    const progress = Math.min(1, (now - plan.createdAt) / total);

    const li = document.createElement("li");
    li.className = "plan " + (status === "ready" ? "ready" : status === "cooling" ? "" : "done");

    const top = document.createElement("div");
    top.className = "plan-top";
    const name = document.createElement("span");
    name.textContent = plan.item;
    const price = document.createElement("span");
    price.textContent = money(plan.price);
    top.append(name, price);

    const text = document.createElement("div");
    text.className = "plan-status";
    if (status === "cooling") {
      const halfway = progress >= 0.5 ? "Halfway there. Still want it? " : "Cooling off · ";
      text.textContent = halfway + formatRemaining(plan.readyAt - now, plan.hourMs);
    } else if (status === "ready") {
      text.textContent = `✅ Ready. You can buy it without a hold for ${READY_WINDOW_DAYS} days.`;
    } else if (status === "bought") {
      text.textContent = "Bought, planned not impulsive 👏";
    } else if (status === "cancelled") {
      text.textContent = "You changed your mind. Money kept.";
    } else {
      text.textContent = "Plan expired. Plan it again if you still want it.";
    }

    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("div");
    fill.style.width = (status === "cooling" || status === "ready" ? progress * 100 : 100) + "%";
    bar.append(fill);

    li.append(top, text, bar);

    if (status === "cooling" || status === "ready") {
      const actions = document.createElement("div");
      actions.className = "actions";
      if (status === "ready") {
        actions.append(button("Buy it", "go", () => finish(plan.id, "bought")));
      }
      actions.append(button("I don't want it anymore", "secondary", () => finish(plan.id, "cancelled")));
      li.append(actions);
    }

    list.append(li);
  }
}

function button(label, className, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.className = className;
  b.addEventListener("click", onClick);
  return b;
}

function finish(id, status) {
  const plan = plans.find((p) => p.id === id);
  if (!plan) return;
  plan.status = status;
  if (status === "cancelled") {
    kept += plan.price;
    save(KEPT_KEY, kept);
  }
  save(STORAGE_KEY, plans);
  render();
}

function updatePreview() {
  const price = Number(document.getElementById("price").value);
  document.getElementById("cooldown-preview").textContent = price > 0
    ? `Cooling-off period: ${cooldownHours(price)} hours`
    : "";
}

document.getElementById("price").addEventListener("input", updatePreview);

document.getElementById("plan-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const item = document.getElementById("item").value.trim();
  const price = Number(document.getElementById("price").value);
  if (!item || !(price > 0)) return;

  const now = Date.now();
  const hourMs = hourLength();
  const readyAt = now + cooldownHours(price) * hourMs;
  plans.unshift({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    item,
    price,
    createdAt: now,
    readyAt,
    expiresAt: readyAt + READY_WINDOW_DAYS * 24 * hourMs,
    hourMs,
    status: "cooling",
  });
  save(STORAGE_KEY, plans);

  e.target.reset();
  updatePreview();
  render();
});

render();
setInterval(render, 250);
  </script>
</body>
</html>
