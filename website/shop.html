<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout</title>
  <!-- A pretend online shop for the demo. Paying sends the purchase to SpendSense. -->
  <style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: #f4f4f4; color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.shops { display: flex; gap: 6px; padding: 10px; background: #222; }
.shops button {
  flex: 1; border: 0; border-radius: 8px; padding: 8px; cursor: pointer;
  background: #3a3a3a; color: #bbb; font-weight: 600; font-family: inherit;
}
.shops button.active { background: #fff; color: #111; }
header { padding: 18px 22px; color: #fff; font-size: 26px; font-weight: 800; letter-spacing: 1px; }
main { padding: 22px; }
h1 { font-size: 18px; margin: 0 0 14px; }
.item {
  display: flex; gap: 14px; align-items: center;
  background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 10px;
}
.thumb { width: 56px; height: 56px; border-radius: 8px; background: #eee; display: grid; place-items: center; font-size: 28px; }
.item div { flex: 1; }
.item small { color: #777; }
.total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin: 18px 0 6px; }
.card-line { color: #666; font-size: 14px; margin-bottom: 18px; }
.pay {
  width: 100%; border: 0; border-radius: 999px; padding: 16px; cursor: pointer;
  font-size: 17px; font-weight: 700; font-family: inherit;
}
.pay:disabled { opacity: 0.6; cursor: default; }
.result { margin-top: 18px; border-radius: 12px; padding: 16px; font-size: 15px; line-height: 1.4; }
.result strong { display: block; font-size: 17px; margin-bottom: 4px; }
.result.allow, .result.nudge { background: #e8f5ee; color: #12603a; }
.result.hold { background: #f3edf7; color: #42145f; }
.result.error { background: #fdecec; color: #8a1c1c; }
  </style>
</head>
<body>
  <nav class="shops" id="shops"></nav>
  <header id="shop-header"></header>
  <main>
    <h1>Your basket</h1>
    <div id="items"></div>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <div class="card-line">Paying with NatWest Debit •••• 4821</div>
    <button class="pay" id="pay" type="button"></button>
    <div class="result" id="result" hidden></div>
  </main>

  <script src="js/core.js"></script>
  <script>
// Each shop maps to a purchase in DEMO.purchases (js/core.js), so amounts stay in sync.
const SHOPS = [
  {
    purchase: "asos", name: "ASOS", colour: "#000", button: "Pay in 4 with Klarna", buttonColour: "#ffb3c7", buttonText: "#000",
    items: [["🧥", "Puffer jacket", 120], ["👟", "Trainers", 150], ["👕", "Oversized hoodie", 70]],
  },
  {
    purchase: "deliveroo", name: "deliveroo", colour: "#00ccbc", button: "Place order", buttonColour: "#00ccbc", buttonText: "#fff",
    items: [["🍕", "Large pizza meal", 34.5], ["🍗", "Wings bucket", 24.2], ["🍰", "Cookie dough + drinks", 21.5]],
  },
  {
    purchase: "tv", name: "currys", colour: "#4c12a1", button: "Pay now", buttonColour: "#4c12a1", buttonText: "#fff",
    items: [["📺", 'Samsung 55" 4K TV', 450]],
  },
  {
    purchase: "tesco", name: "Tesco", colour: "#00539f", button: "Pay now", buttonColour: "#00539f", buttonText: "#fff",
    items: [["🥛", "Milk, bread, eggs", 8.9], ["🍝", "Pasta and sauce", 6.2], ["🍎", "Fruit and veg", 8.3]],
  },
];

let current = SHOPS[0];
let waiting = null;

const el = (id) => document.getElementById(id);
const purchaseFor = (shop) => {
  const p = DEMO.purchases.find((x) => x.id === shop.purchase);
  const { time, ...rest } = p; // no fixed time: SpendSense uses its own clock
  return rest;
};

function showShop(shop) {
  current = shop;
  el("shop-header").textContent = shop.name;
  el("shop-header").style.background = shop.colour;
  el("items").replaceChildren(...shop.items.map(([icon, name, price]) => {
    const row = document.createElement("div");
    row.className = "item";
    const thumb = document.createElement("span");
    thumb.className = "thumb";
    thumb.textContent = icon;
    const text = document.createElement("div");
    text.textContent = name;
    const amount = document.createElement("strong");
    amount.textContent = money(price);
    row.append(thumb, text, amount);
    return row;
  }));
  el("total").textContent = money(purchaseFor(shop).amount);
  const pay = el("pay");
  pay.textContent = shop.button;
  pay.style.background = shop.buttonColour;
  pay.style.color = shop.buttonText;
  pay.disabled = false;
  el("result").hidden = true;
  document.querySelectorAll(".shops button").forEach((b) => b.classList.toggle("active", b.dataset.purchase === shop.purchase));
}

function showResult(action, title, text) {
  clearTimeout(waiting);
  el("pay").disabled = false;
  const r = el("result");
  r.className = "result " + action;
  r.replaceChildren();
  const strong = document.createElement("strong");
  strong.textContent = title;
  r.append(strong, text);
  r.hidden = false;
}

function onResult(data) {
  if (data?.type !== "pact:result") return;
  if (data.action === "hold") {
    showResult("hold", "⏸️ Payment paused by your bank", "SpendSense is holding this payment. Open the app to decide.");
  } else if (data.action === "nudge") {
    showResult("nudge", "💬 Check your SpendSense app", "Quick question before this goes through: still want it?");
  } else {
    showResult("allow", "✅ Payment approved", "Thanks for your order!");
  }
}

// Opened from SpendSense's demo panel → talk to it directly. Opened on its own → BroadcastChannel.
let channel = null;
try {
  channel = new BroadcastChannel("pact");
  channel.onmessage = (e) => onResult(e.data);
} catch {}
window.addEventListener("message", (e) => onResult(e.data));

el("pay").addEventListener("click", () => {
  const msg = { type: "pact:purchase", purchase: purchaseFor(current) };
  el("pay").disabled = true;
  if (window.opener && !window.opener.closed) window.opener.postMessage(msg, "*");
  else if (channel) channel.postMessage(msg);
  waiting = setTimeout(() => showResult("error", "Couldn't reach SpendSense",
    "Open this shop from the 🎬 Demo panel in SpendSense, and keep the SpendSense window open."), 1500);
});

el("shops").replaceChildren(...SHOPS.map((shop) => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.purchase = shop.purchase;
  b.textContent = shop.name;
  b.addEventListener("click", () => showShop(shop));
  return b;
}));
showShop(SHOPS[0]);
  </script>
</body>
</html>
